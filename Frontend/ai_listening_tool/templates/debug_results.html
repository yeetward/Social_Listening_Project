{% extends "base.html" %}{% load static %}
{% block content %}
<div style="padding:20px; max-width:1200px; margin:0 auto; font-family: Arial, sans-serif;">

  <h1>🔍 Social Listening Results</h1>
  <p><a href="/tool/">← Back to Search</a></p>

  <div id="debug-info" style="background:#f0f0f0; padding:10px; margin:10px 0; border-radius:5px;">
    <strong>Debug Info:</strong> JavaScript will load data here...
  </div>

  <div id="simple-results" style="margin:20px 0;">
    <div style="text-align:center; padding:40px; color:#666;">
      Loading...
    </div>
  </div>

</div>

<script>
  document.addEventListener("DOMContentLoaded", async () => {
    const debugDiv = document.getElementById("debug-info");
    const resultsDiv = document.getElementById("simple-results");

    // Get search term from URL
    const urlParams = new URLSearchParams(window.location.search);
    const subject = urlParams.get('subject') || 'test';

    debugDiv.innerHTML = `<strong>Debug:</strong> Searching for "${subject}"...`;

    try {
      // Make API call using global helper
      const data = await window.apiPost('/search/', {
        subject: subject,
        days: 7,
        limit: 10
      });

      debugDiv.innerHTML += `<br><strong>API Status:</strong> 200 OK`;

      const results = Array.isArray(data) ? data : (data.preview || []);

      debugDiv.innerHTML += `<br><strong>Data received:</strong> ${results.length} items`;
      debugDiv.innerHTML += `<br><strong>Response keys:</strong> ${JSON.stringify(Object.keys(data))}`;

      // Display results
      if (results.length === 0) {
        resultsDiv.innerHTML = '<p>No results found.</p>';
      } else {
        resultsDiv.innerHTML = `
        <h2>Found ${results.length} results for "${subject}":</h2>
        ${results.map(item => `
          <div style="border:1px solid #ddd; margin:15px 0; padding:20px; border-radius:8px; background:white;">
            <h3 style="margin:0 0 10px 0; color:#333;">${item.title || 'No title'}</h3>
            <p style="color:#666; line-height:1.5;">${item.summary || item.text || 'No summary available'}</p>
            <div style="margin-top:15px; font-size:14px; color:#888;">
              <span style="margin-right:15px;">📰 ${item.source || 'Unknown source'}</span>
              <span style="margin-right:15px;">📊 Score: ${item.score || 0}</span>
              <span style="margin-right:15px;">💬 Engagement: ${item.engagement?.score || item.engagement || 0}</span>
              ${item.url ? `<a href="${item.url}" target="_blank" style="color:#007bff;">🔗 View Details</a>` : ''}
            </div>
            ${item.tags && item.tags.length > 0 ? `
              <div style="margin-top:10px;">
                ${item.tags.map(tag => `<span style="background:#e9ecef; padding:3px 8px; border-radius:12px; font-size:12px; margin-right:5px;">#${tag}</span>`).join('')}
              </div>
            ` : ''}
          </div>
        `).join('')}
      `;
      }

    } catch (error) {
      debugDiv.innerHTML += `<br><strong>Error:</strong> ${error.message}`;
      resultsDiv.innerHTML = `<div style="color:red; text-align:center; padding:20px;">
      Error loading results: ${error.message}
    </div>`;
    }
  });
</script>

{% endblock %}
